<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AlgaLux | Precision 3D Bio-Battery</title>
    <style>
        :root {
            --algae-green: #39ff14;
            --proton-blue: #00e5ff;
            --blue-cap: #0d47a1;
            --pem-gold: #ffd600;
        }

        body {
            background: #000;
            background-image: radial-gradient(circle at center, #061506 0%, #000 100%);
            color: white;
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            perspective: 1500px;
        }

        .header { text-align: center; margin-bottom: 50px; z-index: 100; }
        .header h1 { font-size: 3rem; margin: 0; text-shadow: 0 0 20px var(--algae-green); letter-spacing: 6px; }

        .lab-stage {
            position: relative;
            width: 850px;
            height: 400px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transform-style: preserve-3d;
        }

        /* --- 頂層外部電路 (電子與導線) --- */
        .circuit-layer {
            position: absolute;
            top: 25px; /* 瓶蓋頂部位置 */
            left: 0;
            width: 100%;
            height: 40px;
            z-index: 999; /* 絕對置頂 */
            transform-style: preserve-3d;
            pointer-events: none;
        }

        .real-wire {
            position: absolute;
            top: 10px;
            left: 175px;
            width: 475px;
            height: 3px;
            background: #333;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .electron-particle {
            position: absolute;
            width: 26px;
            height: 26px;
            background: var(--algae-green);
            border-radius: 50%;
            box-shadow: 0 0 20px var(--algae-green);
            color: black;
            font-weight: bold;
            font-size: 11px;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: electronPath 4s linear infinite;
        }

        @keyframes electronPath {
            0%   { transform: translate(637px, 10px) scale(0); opacity: 0; } /* 從右電極頂端冒出 */
            10%  { transform: translate(637px, 10px) scale(1); opacity: 1; }
            85%  { transform: translate(162px, 10px) scale(1); opacity: 1; } /* 移到左電極頂端 */
            100% { transform: translate(162px, 40px) scale(0); opacity: 0; }  /* 鑽進去 */
        }

        /* --- 3D 瓶子建模 --- */
        .bottle-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 200px;
            transform-style: preserve-3d;
            position: relative;
        }

        /* 瓶蓋 */
        .cap-3d {
            width: 100px; height: 35px;
            background: linear-gradient(135deg, #1e88e5, #0d47a1);
            border-radius: 8px 8px 2px 2px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.8);
            position: relative;
            z-index: 20;
        }

        /* 玻璃瓶身 */
        .glass-body {
            position: relative;
            width: 150px; height: 240px;
            background: linear-gradient(90deg, rgba(255,255,255,0.02), rgba(255,255,255,0.1) 20%, rgba(255,255,255,0.02) 50%, rgba(255,255,255,0.08) 80%, rgba(255,255,255,0.02));
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 15px 15px 45px 45px;
            backdrop-filter: blur(5px);
            margin-top: -5px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            display: flex; justify-content: center;
            cursor: pointer;
            transform-style: preserve-3d;
        }

        /* 電極棒 (這次插進去了！) */
        .electrode-rod {
            position: absolute;
            top: -20px; /* 從蓋子處延伸 */
            width: 12px;
            height: 180px;
            background: linear-gradient(90deg, #111, #333, #111);
            border-radius: 2px;
            z-index: 10;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        .liquid { position: absolute; bottom: 8px; width: 140px; height: 70%; border-radius: 10px 10px 40px 40px; z-index: 5; }
        .sludge { background: linear-gradient(to top, #1a0f00, #4e342e); }
        .algae { background: linear-gradient(to top, #003300, #2e7d32); box-shadow: inset 0 0 20px var(--algae-green); }

        /* --- 中間橋接器 --- */
        .bridge-container {
            position: absolute; bottom: 130px; left: 50%; transform: translateX(-50%);
            width: 440px; height: 20px;
            z-index: 1;
        }
        .tube { width: 100%; height: 100%; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; }
        .pem-membrane {
            position: absolute; left: 50%; top: -15px; width: 15px; height: 50px;
            background: var(--pem-gold); border-radius: 50%; box-shadow: 0 0 20px var(--pem-gold);
        }
        .pem-label { position: absolute; top: -40px; left: 50%; transform: translateX(-50%); color: var(--pem-gold); font-weight: bold; font-size: 0.8rem; letter-spacing: 1px; }

        .proton { color: var(--proton-blue); font-weight: bold; position: absolute; animation: protonPath 3s linear infinite; }
        @keyframes protonPath {
            0% { transform: translateX(180px); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateX(-180px); opacity: 0; }
        }

        .tag { margin-top: 30px; font-weight: bold; color: var(--algae-green); letter-spacing: 3px; font-size: 0.9rem; }

        /* 彈窗 */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 2000; align-items: center; justify-content: center; }
        .modal-card { background: #111; border: 1px solid var(--algae-green); padding: 30px; border-radius: 15px; width: 400px; text-align: center; }
        .formula { background: rgba(255,255,255,0.05); color: var(--algae-green); padding: 12px; border-radius: 8px; margin: 15px 0; font-family: monospace; }
        .close-btn { background: var(--algae-green); border: none; padding: 10px 30px; border-radius: 5px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <div class="header">
        <h1>AlgaLux</h1>
        <p>Sustainable Bio-Battery Simulation</p>
    </div>

    <div class="lab-stage">
        
        <div class="circuit-layer">
            <div class="real-wire"></div>
            <div class="electron-particle">e-</div>
        </div>

        <div class="bottle-group">
            <div class="cap-3d"></div>
            <div class="glass-body" onclick="show('cathode')">
                <div class="electrode-rod"></div>
                <div class="liquid algae"></div>
            </div>
            <div class="tag">CATHODE (ALGAE)</div>
        </div>

        <div class="bridge-container">
            <div class="pem-label">PEM MEMBRANE</div>
            <div class="pem-membrane"></div>
            <div class="tube"></div>
            <div class="proton" style="left: 50%;">H+</div>
        </div>

        <div class="bottle-group">
            <div class="cap-3d"></div>
            <div class="glass-body" onclick="show('anode')">
                <div class="electrode-rod"></div>
                <div class="liquid sludge"></div>
            </div>
            <div class="tag">ANODE (SLUDGE)</div>
        </div>
    </div>

    <div id="modal" class="modal" onclick="closeM()">
        <div class="modal-card" onclick="event.stopPropagation()">
            <h2 id="t" style="color: var(--algae-green); margin-top: 0;"></h2>
            <p id="d" style="color: #ccc; line-height: 1.6;"></p>
            <div id="f" class="formula"></div>
            <button class="close-btn" onclick="closeM()">CLOSE</button>
        </div>
    </div>

    <script>
        function show(type) {
            const m = document.getElementById('modal');
            if (type === 'anode') {
                document.getElementById('t').innerText = "Anode: Bio-Oxidation";
                document.getElementById('d').innerText = "Anaerobic bacteria in the sludge break down waste, releasing electrons (e-) and protons (H+).";
                document.getElementById('f').innerHTML = "CH<sub>2</sub>O + H<sub>2</sub>O → CO<sub>2</sub> + 4H<sup>+</sup> + 4e<sup>-</sup>";
            } else {
                document.getElementById('t').innerText = "Cathode: Photo-Reduction";
                document.getElementById('d').innerText = "Microalgae produce oxygen via photosynthesis, which acts as the electron acceptor.";
                document.getElementById('f').innerHTML = "O<sub>2</sub> + 4H<sup>+</sup> + 4e<sup>-</sup> → 2H<sub>2</sub>O";
            }
            m.style.display = "flex";
        }
        function closeM() { document.getElementById('modal').style.display = "none"; }
    </script>
</body>
</html>
